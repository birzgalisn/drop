packages:
  - 'apps/*'
  - 'packages/tooling'
  - 'packages/nest'
  - 'packages/react'
  - 'packages/shared'

injectWorkspacePackages: false
forceLegacyDeploy: true

engineStrict: true
strictPeerDependencies: false

# Explicit pnpm 11 supply-chain defaults (already true by default; kept visible)
minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  core-js: false
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

