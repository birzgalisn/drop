services:
  api:
    image: ${IMAGE_ROOT}-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      APEX: ${APEX}
    volumes:
      - media_data:/drop-media
    networks:
      - drop_edge
      - drop_internal
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 2s
        order: start-first
        failure_action: rollback
        monitor: 10s
      restart_policy:
        condition: on-failure
        delay: 2s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${PROJECT}-api.rule=Host(`api.${APEX}`)
        - traefik.http.routers.${PROJECT}-api.entrypoints=https
        - traefik.http.routers.${PROJECT}-api.tls=true
        - traefik.http.routers.${PROJECT}-api.tls.certresolver=letsencrypt
        - traefik.http.routers.${PROJECT}-api.service=${PROJECT}-api
        - traefik.http.services.${PROJECT}-api.loadbalancer.server.port=3000
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.path=/up
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.timeout=3s
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/up]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  drop_edge:
    external: true
  drop_internal:
    external: true

volumes:
  media_data:
    external: true
    name: drop_media
