name: image

on:
  workflow_call:
    inputs:
      app:
        description: App to build an image for
        required: true
        type: string
      build-args:
        description: Docker build-args (newline-separated KEY=VALUE)
        required: false
        type: string
        default: ''
    outputs:
      image_root:
        description: ghcr.io/owner/repo
        value: ${{ jobs.image.outputs.image_root }}
      image_tag:
        description: Image tag (branch name)
        value: ${{ jobs.image.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image_root: ${{ steps.meta.outputs.root }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Coordinates
        id: meta
        run: |
          set -euo pipefail
          app="${{ inputs.app }}"
          repo="${GITHUB_REPOSITORY,,}"
          name="${repo#*/}"
          {
            echo "root=ghcr.io/${repo}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "name=ghcr.io/${repo}-${app}"
            echo "package=${name}-${app}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: tags
        with:
          images: ${{ steps.meta.outputs.name }}
          tags: type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.name }}:buildcache,mode=max

      - name: Prune untagged versions
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          ROOT: >-
            ${{
              github.event.repository.owner.type == 'Organization'
              && format('orgs/{0}', github.repository_owner)
              || format('users/{0}', github.repository_owner)
            }}
        run: |
          set -euo pipefail
          path="${ROOT}/packages/container/${PACKAGE}"

          untagged_ids() {
            gh api --paginate "${path}/versions" \
              --jq '.[] | select((.metadata.container.tags // []) | length == 0) | .id'
          }

          delete_version() {
            local id="$1"
            gh api --method DELETE --silent "${path}/versions/${id}"
            echo "Deleted ${id}"
          }

          while read -r id; do
            [[ -n "${id}" ]] || continue
            delete_version "${id}"
          done < <(untagged_ids)
