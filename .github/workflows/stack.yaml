name: stack

on:
  workflow_call:
    inputs:
      app:
        description: App service to roll (api or web)
        required: true
        type: string
      image_root:
        description: ghcr.io/owner/repo
        required: true
        type: string
      image_tag:
        description: Tag to deploy
        required: true
        type: string

concurrency:
  group: ${{ github.repository }}-swarm-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  PROJECT: ${{ vars.PROJECT }}
  APEX: ${{ vars.APEX }}
  IMAGE_ROOT: ${{ inputs.image_root }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  APP: ${{ inputs.app }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
  REDIS_URL: redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/0

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .devops

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          set -euo pipefail
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "${{ secrets.SSH_KEY }}"
          mkdir -p ~/.ssh
          printf '%s\n' 'HOST *' 'StrictHostKeyChecking no' > ~/.ssh/config

          export DOCKER_HOST="ssh://${SSH_USER}@${SSH_HOST}"
          image="${IMAGE_ROOT}-${APP}:${IMAGE_TAG}"

          docker pull "$image"
          # One stack (`drop`); both files so the other service is not removed.
          docker stack deploy --with-registry-auth \
            -c .devops/stack-api.yaml \
            -c .devops/stack-web.yaml \
            drop
          docker service update --detach=false \
            --image "$image" "drop_${APP}"

          docker image prune -f
          docker container prune -f
