name: ci

on:
  workflow_call:
    inputs:
      app:
        description: App to build (api or web)
        required: true
        type: string
      build-args:
        description: Docker build-args (newline-separated KEY=VALUE)
        required: false
        type: string
        default: ''
    outputs:
      image_root:
        description: ghcr.io/owner/repo
        value: ${{ jobs.build.outputs.image_root }}
      image_tag:
        description: Image tag (branch name)
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Format, lint, and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Generate
        env:
          APEX: ci.localhost
          DATABASE_URL: postgresql://ci:ci@postgres:5432/ci
          REDIS_URL: redis://:ci@redis:6379/0
        run: pnpm exec turbo run generate --filter="${{ inputs.app }}..."

      - name: Lint and typecheck
        run: pnpm exec turbo run lint check-types --filter="${{ inputs.app }}..."

  build:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_root: ${{ steps.image.outputs.root }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: image
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          name="${repo#*/}"
          {
            echo "root=ghcr.io/${repo}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "name=ghcr.io/${repo}-${{ inputs.app }}"
            echo "package=${name}-${{ inputs.app }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.image.outputs.package }}
          package-type: container
          delete-only-untagged-versions: true
