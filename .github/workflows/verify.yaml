name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Format
        run: pnpm run format:check

      - name: Generate
        env:
          APEX: verify.localhost
          DATABASE_URL: postgresql://verify:verify@postgres:5432/verify
          REDIS_URL: redis://:verify@redis:6379/0
        run: pnpm exec turbo run generate

      - name: Lint, typecheck
        run: pnpm exec turbo run lint check-types
