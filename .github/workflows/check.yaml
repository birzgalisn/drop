name: check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Format
        run: pnpm run format:check

      - name: Generate
        env:
          APEX: check.localhost
          DATABASE_URL: postgresql://check:check@postgres:5432/check
          REDIS_URL: redis://:check@redis:6379/0
        run: pnpm exec turbo run generate

      - name: Lint, typecheck
        run: pnpm exec turbo run lint check-types
